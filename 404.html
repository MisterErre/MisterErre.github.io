<!DOCTYPE html>

<style>
/* Root-relative paths: GitHub Pages serves this file at whatever URL missed. */
@font-face{font-family:'Bevan';font-display:swap;src:url(/fonts/bevan-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Share Tech Mono';font-display:swap;src:url(/fonts/share-tech-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:100 900;font-display:swap;src:url(/fonts/inter-latin-wght-normal.woff2) format('woff2')}
:root{--void:#0b0916;--red:#ff2f52;--cyan:#3aeaff;--muted:#bcb4d6;--line:#3d2f66}
*{box-sizing:border-box}
body{margin:0;font-weight:400;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(ellipse at 50% 70%,rgba(255,47,82,.18),transparent 60%),var(--void);
  color:#f6f3fc;font-family:'Inter',system-ui,sans-serif;line-height:1.65}
main{max-width:560px}
.code{font-family:'Share Tech Mono',monospace;color:var(--red-soft,#ff8095);font-size:1rem;margin:0 0 14px}
h1{font-family:'Bevan',Georgia,serif;font-weight:400;text-transform:uppercase;line-height:1.05;margin:0 0 18px;
  font-size:clamp(2.2rem,9vw,4rem);color:#fff;
  text-shadow:0 0 4px rgba(255,255,255,.55),0 0 12px var(--red),0 0 32px rgba(255,30,66,.75),0 0 70px rgba(255,30,66,.45)}
p{color:var(--muted);margin:0 0 28px}
a{display:inline-block;padding:12px 18px;border:1px solid var(--red);color:#fff;text-decoration:none;
  min-height:48px;font-size:1rem;font-weight:500;border-radius:3px;
  background:rgba(255,47,82,.1);box-shadow:0 0 16px rgba(255,47,82,.3),inset 0 0 16px rgba(255,47,82,.1);transition:.18s ease}
a:hover,a:focus-visible{border-color:var(--cyan);color:var(--cyan);background:rgba(58,234,255,.1);
  box-shadow:0 0 28px rgba(58,234,255,.45),inset 0 0 20px rgba(58,234,255,.1);outline:none}
a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
@media (prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
<body>
<main>
  <p class="code">Error 404</p>
  <h1>Access<br>denied</h1>
